global:
  timezone: Europe/Paris
  storageClass: longhorn-custom
  imagePullSecrets:
    - ghcr-secret
  keel:
    enabled: true
    policy: force
    trigger: poll
    pollSchedule: "@every 1m"
    matchTag: "true"
  nodeSelector: {}

singleReplicaStorageClass:
  create: true
  name: longhorn-grimmory-single
  reclaimPolicy: Retain
  allowVolumeExpansion: true
  parameters:
    numberOfReplicas: "1"
    staleReplicaTimeout: "2880"
    fsType: ext4
    dataLocality: best-effort
    fromBackup: ""

images:
  grimmory:
    repository: ghcr.io/raphcvr/grimmory
    tag: downloads-acquisition
    pullPolicy: Always
  mariadb:
    repository: mariadb
    tag: "11.4"
    pullPolicy: IfNotPresent
  flaresolverr:
    repository: ghcr.io/flaresolverr/flaresolverr
    tag: v3.5.0
    digest: sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47
    pullPolicy: IfNotPresent
  prowlarr:
    repository: lscr.io/linuxserver/prowlarr
    tag: latest
    digest: sha256:c9fe528f34b1fd3715438b6f6d6991d64e2965f2c055db36398bc66a0e7eab01
    pullPolicy: IfNotPresent
  qbittorrent:
    repository: lscr.io/linuxserver/qbittorrent
    tag: latest
    digest: sha256:715d2bfbcf1cd3d734cbbd4fbd599eb7ea0642eaa079a372dd0d343f59516700
    pullPolicy: IfNotPresent
  stacks:
    repository: zelest/stacks
    tag: latest
    digest: sha256:596d02602f80cef566b61b8abd3c1eee2bc6110c1a39b96401704d20cff71667
    pullPolicy: IfNotPresent
  bootstrap:
    repository: python
    tag: 3.13-alpine
    pullPolicy: IfNotPresent
  busybox:
    repository: busybox
    tag: 1.37
    pullPolicy: IfNotPresent

secrets:
  create: true
  existingSecret: ""
  database:
    username: grimmory
    password: change-me-grimmory
    rootPassword: change-me-root
  admin:
    username: admin
    password: change-me-admin
  prowlarr:
    apiKey: change-me-prowlarr-api-key
  comicVine:
    apiKey: change-me-comicvine-api-key
  qbittorrent:
    username: admin
    password: change-me-qbittorrent-password
    passwordPbkdf2: change-me-qbittorrent-pbkdf2-password
  stacks:
    username: admin
    passwordBcrypt: change-me-stacks-bcrypt-password
    apiKey: change-me-stacks-admin-api-key
    downloaderKey: change-me-stacks-downloader-key
    sessionSecret: change-me-stacks-session-secret

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1024m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    grimmory: grimmory.raphcvr.me
    prowlarr: prowlarr.raphcvr.me
    qbittorrent: qbit.raphcvr.me
    stacks: stacks.raphcvr.me
  tls: []

persistence:
  keepOnDelete: true
  claims:
    grimmory-data:
      enabled: true
      size: 2Gi
      accessMode: ReadWriteOnce
    grimmory-books:
      enabled: true
      size: 10Gi
      accessMode: ReadWriteOnce
      storageClass: longhorn-grimmory-single
    bookdrop:
      enabled: true
      size: 10Gi
      accessMode: ReadWriteOnce
      storageClass: longhorn-grimmory-single
    mariadb-data:
      enabled: true
      size: 20Gi
      accessMode: ReadWriteOnce
    prowlarr-config:
      enabled: true
      size: 5Gi
      accessMode: ReadWriteOnce
    qbittorrent-config:
      enabled: true
      size: 5Gi
      accessMode: ReadWriteOnce
    stacks-data:
      enabled: false
      size: 5Gi
      accessMode: ReadWriteOnce
      storageClass: longhorn-grimmory-single

grimmory:
  port: 6060
  userId: "1000"
  groupId: "1000"
  diskType: LOCAL
  apiDocsEnabled: "true"
  forceDisableOidc: "false"
  uploadsPerUser: "10"
  downloads:
    defaultLibraryName: Downloads
    defaultLibraryPath: /bookdrop
    defaultAutoFinalize: "true"
    defaultConfidenceThreshold: "90"
    flaresolverr:
      url: http://flaresolverr:8191/v1
      timeoutMs: "60000"
    resolver:
      webtoons:
        asura:
          enabled: "true"
          searchUrlTemplates: "https://asurascans.com/comics?search={query},https://comicasura.net/?s={query}"
      comicVine:
        enabled: "true"
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 3Gi

mariadb:
  database: grimmory
  protection:
    enabled: true
    dump:
      enabled: true
      cronJobName: grimmory-mariadb-logical-dump
      schedule: "17 */4 * * *"
      suspend: false
      startingDeadlineSeconds: 600
      activeDeadlineSeconds: 900
      retentionDays: 14
      allowEmpty: false
      emptyDatabaseAction: skip
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 512Mi
      pvc:
        name: grimmory-mariadb-dumps
        size: 5Gi
        accessMode: ReadWriteOnce
      storageClass:
        create: true
        name: longhorn-grimmory-retain-2
        reclaimPolicy: Retain
        allowVolumeExpansion: true
        parameters:
          numberOfReplicas: "2"
          staleReplicaTimeout: "2880"
          fsType: ext4
          dataLocality: best-effort
    snapshot:
      enabled: true
      namespace: longhorn-system
      recurringJobName: grimmory-db-2h-snapshot
      group: grimmory-db
      cron: "7 */2 * * *"
      retain: 36
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      memory: 2Gi

flaresolverr:
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      memory: 1Gi

prowlarr:
  port: 9696
  userId: "1000"
  groupId: "1000"
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 1Gi

qbittorrent:
  webPort: 8080
  bittorrentPort: 6881
  userId: "1000"
  groupId: "1000"
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      memory: 2Gi

stacks:
  port: 7788
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      memory: 2Gi

bootstrapSources:
  enabled: true
  backoffLimit: 4
  activeDeadlineSeconds: 900
  annasArchive:
    baseUrl: https://annas-archive.gl
    fallbackBaseUrls:
      - https://annas-archive.gd
      - https://annas-archive.pk
      - https://annas-archive.li
  mangaDex:
    translatedLanguages:
      - en
      - fr
  kagane:
    enabled: false
  prowlarr:
    indexerIds: ""
    flareSolverrProxy:
      enabled: true
      name: FlareSolverr
      tag: flaresolverr
      host: http://flaresolverr:8191/
      requestTimeout: 60
    deleteIndexers:
      - linuxtracker
      - internetarchive
    bootstrapIndexers:
      - definitionName: nyaasi
        name: Nyaa.si
        enabled: true
        required: true
        priority: 25
        fields:
          baseUrl: https://nyaa.si/
          prefer_magnet_links: true
          cat-id: 9
          filter-id: 0
          sort: 1
          type: 1
      - definitionName: 1337x
        name: 1337x
        enabled: true
        required: false
        priority: 25
        proxyTag: flaresolverr
        fields:
          baseUrl: https://1337x.to/
          downloadlink: 1
          downloadlink2: 1
          disablesort: true
          sort: 2
          type: 1
