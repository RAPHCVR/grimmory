apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  labels:
    {{- include "grimmory-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: prowlarr
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.prowlarr.port }}
      targetPort: http
  selector:
    {{- include "grimmory-stack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: prowlarr
