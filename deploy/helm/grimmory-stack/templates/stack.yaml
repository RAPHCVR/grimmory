    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.hosts.grimmory | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grimmory
