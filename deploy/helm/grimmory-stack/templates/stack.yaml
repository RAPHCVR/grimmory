              service:
                name: qbittorrent
                port:
                  number: {{ .Values.qbittorrent.webPort }}
    - host: {{ .Values.ingress.hosts.stacks | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stacks
                port:
                  number: {{ .Values.stacks.port }}
