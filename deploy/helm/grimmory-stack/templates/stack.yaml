{{- if .Values.bootstrapSources.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: grimmory-source-bootstrap
  labels:
    {{- include "grimmory-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.bootstrapSources.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.bootstrapSources.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "grimmory-stack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- include "grimmory-stack.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: source-bootstrap
          image: "{{ include "grimmory-stack.image" .Values.images.bootstrap }}"
          imagePullPolicy: {{ .Values.images.bootstrap.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: GRIMMORY_API_BASE
              value: "http://grimmory:{{ .Values.grimmory.port }}/api/v1"
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: admin-username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: admin-password
            - name: PROWLARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: prowlarr-api-key
            - name: QBIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: qbittorrent-username
            - name: QBIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: qbittorrent-password
            - name: STACKS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: stacks-api-key
            - name: STACKS_DOWNLOADER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: stacks-downloader-key
            - name: ANNAS_BASE_URL
              value: {{ .Values.bootstrapSources.annasArchive.baseUrl | quote }}
            - name: ANNAS_FALLBACK_BASE_URLS
              value: {{ join "," .Values.bootstrapSources.annasArchive.fallbackBaseUrls | quote }}
            - name: MANGADEX_LANGUAGES
              value: {{ join "," .Values.bootstrapSources.mangaDex.translatedLanguages | quote }}
            - name: PROWLARR_INDEXER_IDS
              value: {{ .Values.bootstrapSources.prowlarr.indexerIds | quote }}
            - name: PROWLARR_BOOTSTRAP_INDEXERS
              value: {{ .Values.bootstrapSources.prowlarr.bootstrapIndexers | toJson | quote }}
            - name: PROWLARR_FLARESOLVERR_PROXY
              value: {{ .Values.bootstrapSources.prowlarr.flareSolverrProxy | toJson | quote }}
            - name: PROWLARR_DELETE_INDEXERS
              value: {{ .Values.bootstrapSources.prowlarr.deleteIndexers | toJson | quote }}
            - name: GRIMMORY_DOWNLOADS_FLARESOLVERR_URL
              value: {{ .Values.grimmory.downloads.flaresolverr.url | quote }}
            - name: GRIMMORY_DOWNLOADS_FLARESOLVERR_TIMEOUT_MS
              value: {{ .Values.grimmory.downloads.flaresolverr.timeoutMs | quote }}
          command: ["python", "-c"]
          args:
            - |
              import json
              import os
              import sys
              import time
              import urllib.error
              import urllib.parse
              import urllib.request

              base = os.environ["GRIMMORY_API_BASE"].rstrip("/")
              prowlarr_base = "http://prowlarr:{{ .Values.prowlarr.port }}/api/v1"

              def call(method, path, payload=None, token=None, timeout=20):
                  data = None
                  headers = {"Accept": "application/json"}
                  if payload is not None:
                      data = json.dumps(payload).encode("utf-8")
                      headers["Content-Type"] = "application/json"
                  if token:
                      headers["Authorization"] = "Bearer " + token
                  req = urllib.request.Request(base + path, data=data, method=method, headers=headers)
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as resp:
                          body = resp.read().decode("utf-8")
                          return json.loads(body) if body else {}
                  except urllib.error.HTTPError as exc:
                      body = exc.read().decode("utf-8", "replace")
                      raise RuntimeError(f"{method} {path} failed with HTTP {exc.code}: {body}") from exc

              def prowlarr_call(method, path, payload=None, timeout=30):
                  data = None
                  headers = {
                      "Accept": "application/json",
                      "X-Api-Key": os.environ["PROWLARR_API_KEY"],
                  }
                  if payload is not None:
                      data = json.dumps(payload).encode("utf-8")
                      headers["Content-Type"] = "application/json"
                  req = urllib.request.Request(prowlarr_base + path, data=data, method=method, headers=headers)
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as resp:
                          body = resp.read().decode("utf-8")
                          return json.loads(body) if body else {}
                  except urllib.error.HTTPError as exc:
                      body = exc.read().decode("utf-8", "replace")
                      raise RuntimeError(f"Prowlarr {method} {path} failed with HTTP {exc.code}: {body}") from exc

              def set_field(resource, name, value):
                  for field in resource.get("fields") or []:
                      if field.get("name") == name:
                          field["value"] = value
                          return
                  print(f"Prowlarr schema field {name!r} not found for {resource.get('definitionName')}", flush=True)

              def ensure_prowlarr_tag(label):
                  if not label:
                      return None
                  tags = prowlarr_call("GET", "/tag", timeout=20)
                  current = next((entry for entry in tags if entry.get("label") == label), None)
                  if current and current.get("id") is not None:
                      return current["id"]
                  created = prowlarr_call("POST", "/tag", {"label": label}, timeout=20)
                  tag_id = created.get("id")
                  if not tag_id:
                      raise RuntimeError(f"Prowlarr tag {label!r} was not created")
                  print(f"created Prowlarr tag {label}", flush=True)
                  return tag_id

              def ensure_prowlarr_flaresolverr_proxy():
                  raw = os.environ.get("PROWLARR_FLARESOLVERR_PROXY", "{}")
                  config = json.loads(raw) if raw.strip() else {}
                  if not bool(config.get("enabled", False)):
                      return {}

                  tag = config.get("tag") or "flaresolverr"
                  tag_id = ensure_prowlarr_tag(tag)
                  name = config.get("name") or "FlareSolverr"
                  host = config.get("host") or "http://flaresolverr:8191/"
                  request_timeout = int(config.get("requestTimeout") or 60)

                  proxies = prowlarr_call("GET", "/indexerproxy", timeout=20)
                  current = next((entry for entry in proxies if entry.get("implementation") == "FlareSolverr" or entry.get("name") == name), None)
                  if current:
                      payload = json.loads(json.dumps(current))
                  else:
                      schemas = prowlarr_call("GET", "/indexerproxy/schema", timeout=30)
                      schema = next((entry for entry in schemas if entry.get("implementation") == "FlareSolverr"), None)
                      if not schema:
                          raise RuntimeError("Prowlarr FlareSolverr proxy schema not found")
                      payload = json.loads(json.dumps(schema))

                  payload["name"] = name
                  payload["tags"] = [tag_id] if tag_id else []
                  set_field(payload, "host", host)
                  set_field(payload, "requestTimeout", request_timeout)

                  if current and current.get("id") is not None:
                      payload["id"] = current["id"]
                      prowlarr_call("PUT", f"/indexerproxy/{current['id']}", payload, timeout=30)
                      print(f"updated Prowlarr indexer proxy {name}", flush=True)
                  else:
                      prowlarr_call("POST", "/indexerproxy", payload, timeout=30)
                      print(f"created Prowlarr indexer proxy {name}", flush=True)
                  return {tag: tag_id}

              def delete_prowlarr_indexers():
                  raw = os.environ.get("PROWLARR_DELETE_INDEXERS", "[]")
                  configured = json.loads(raw) if raw.strip() else []
                  definitions = {str(item).strip().lower() for item in configured if str(item).strip()}
                  if not definitions:
                      return
                  existing = prowlarr_call("GET", "/indexer", timeout=20)
                  for entry in existing:
                      definition = str(entry.get("definitionName") or "").lower()
                      if definition not in definitions:
                          continue
                      indexer_id = entry.get("id")
                      if indexer_id is None:
                          continue
                      prowlarr_call("DELETE", f"/indexer/{indexer_id}", timeout=30)
                      print(f"deleted Prowlarr indexer {entry.get('name') or definition}", flush=True)

              def ensure_prowlarr_indexers():
                  raw = os.environ.get("PROWLARR_BOOTSTRAP_INDEXERS", "[]")
                  configured = json.loads(raw) if raw.strip() else []
                  if not configured:
                      return

                  deadline = time.time() + 180
                  while True:
                      try:
                          prowlarr_call("GET", "/system/status", timeout=5)
                          break
                      except Exception as exc:
                          if time.time() > deadline:
                              raise
                          print(f"waiting for prowlarr api: {exc}", flush=True)
                          time.sleep(5)

                  profiles = prowlarr_call("GET", "/appprofile", timeout=20)
                  profile_id = (profiles[0] if profiles else {}).get("id")
                  if not profile_id:
                      raise RuntimeError("Prowlarr app profile not found")
                  schemas = prowlarr_call("GET", "/indexer/schema", timeout=60)
                  delete_prowlarr_indexers()
                  tag_cache = ensure_prowlarr_flaresolverr_proxy()

                  for item in configured:
                      definition = item.get("definitionName")
                      display_name = item.get("name") or definition
                      required = bool(item.get("required", True))
                      try:
                          existing = prowlarr_call("GET", "/indexer", timeout=20)
                          current = next((entry for entry in existing if entry.get("definitionName") == definition or entry.get("name") == display_name), None)
                          schema = next((entry for entry in schemas if entry.get("definitionName") == definition), None)
                          if not schema:
                              raise RuntimeError(f"Prowlarr schema {definition!r} not found")
                          payload = json.loads(json.dumps(schema))
                          payload["name"] = display_name
                          payload["enable"] = bool(item.get("enabled", True))
                          payload["appProfileId"] = profile_id
                          payload["priority"] = int(item.get("priority", 25))
                          tag_ids = []
                          for tag_label in item.get("tags") or []:
                              tag_id = tag_cache.get(tag_label)
                              if not tag_id:
                                  tag_id = ensure_prowlarr_tag(tag_label)
                                  tag_cache[tag_label] = tag_id
                              if tag_id:
                                  tag_ids.append(tag_id)
                          proxy_tag = item.get("proxyTag")
                          if proxy_tag:
                              tag_id = tag_cache.get(proxy_tag)
                              if not tag_id:
                                  tag_id = ensure_prowlarr_tag(proxy_tag)
                                  tag_cache[proxy_tag] = tag_id
                              if tag_id:
                                  tag_ids.append(tag_id)
                          if tag_ids:
                              payload["tags"] = sorted(set(tag_ids))
                          for name, value in (item.get("fields") or {}).items():
                              set_field(payload, name, value)
                          if current and current.get("id") is not None:
                              payload["id"] = current["id"]
                              prowlarr_call("PUT", f"/indexer/{current['id']}?forceSave=true", payload, timeout=90)
                              print(f"updated Prowlarr indexer {display_name}", flush=True)
                          else:
                              prowlarr_call("POST", "/indexer?forceSave=true", payload, timeout=90)
                              print(f"created Prowlarr indexer {display_name}", flush=True)
                      except Exception as exc:
                          print(f"Prowlarr indexer bootstrap failed for {display_name}: {exc}", flush=True)
                          if required:
                              raise

              deadline = time.time() + 600
              while True:
                  try:
                      call("GET", "/healthcheck", timeout=5)
                      break
                  except Exception as exc:
                      if time.time() > deadline:
                          raise
                      print(f"waiting for grimmory api: {exc}", flush=True)
                      time.sleep(5)

              ensure_prowlarr_indexers()

              setup_status = call("GET", "/setup/status")
              setup_done = bool(setup_status.get("data")) if isinstance(setup_status, dict) else True
              if not setup_done:
                  print("initial setup is pending, creating admin user", flush=True)
                  call("POST", "/setup", {
                      "username": os.environ["ADMIN_USERNAME"],
                      "email": os.environ["ADMIN_USERNAME"] + "@local.raphcvr.me",
                      "name": "Administrator",
                      "password": os.environ["ADMIN_PASSWORD"],
                  })

              login_payloads = [
                  {"username": os.environ["ADMIN_USERNAME"], "password": os.environ["ADMIN_PASSWORD"]},
                  {"email": os.environ["ADMIN_USERNAME"], "password": os.environ["ADMIN_PASSWORD"]},
              ]
              token = None
              for payload in login_payloads:
                  try:
                      login = call("POST", "/auth/login", payload)
                      token = login.get("accessToken") or login.get("token") or login.get("jwt")
                      if token:
                          break
                  except Exception as exc:
                      print(f"login attempt failed: {exc}", flush=True)
              if not token:
                  raise RuntimeError("could not authenticate source bootstrap against Grimmory")

              def as_list(value):
                  return [part.strip() for part in value.split(",") if part.strip()]

              fallback_urls = as_list(os.environ.get("ANNAS_FALLBACK_BASE_URLS", ""))
              langs = as_list(os.environ.get("MANGADEX_LANGUAGES", "en,fr"))
              flare_url = os.environ.get("GRIMMORY_DOWNLOADS_FLARESOLVERR_URL", "http://flaresolverr:8191/v1")
              flare_timeout_ms = int(os.environ.get("GRIMMORY_DOWNLOADS_FLARESOLVERR_TIMEOUT_MS", "60000"))

              sources = [
                  {
                      "name": "Prowlarr (Auto-Deploy)",
                      "type": "PROWLARR_TORZNAB",
                      "enabled": True,
                      "priority": 10,
                      "configJson": json.dumps({
                          "qbittorrent": {
                              "baseUrl": "http://qbittorrent:8080",
                              "username": os.environ["QBIT_USERNAME"],
                              "password": os.environ["QBIT_PASSWORD"],
                              "category": "grimmory",
                              "tags": "grimmory",
                              "remoteSavePath": "{stagingDir}",
                              "localSavePath": "{stagingDir}",
                              "deleteTorrentOnComplete": True,
                              "deleteFilesOnComplete": True,
                              "timeoutMinutes": 180,
                              "pollIntervalSeconds": 10
                          },
                          "flareSolverr": {
                              "enabled": True,
                              "url": flare_url,
                              "maxTimeoutMs": flare_timeout_ms
                          }
                      }, separators=(",", ":")),
                      "credentialsJson": json.dumps({
                          "baseUrl": "http://prowlarr:9696",
                          "apiKey": os.environ["PROWLARR_API_KEY"],
                          "apiMode": "PROWLARR",
                          "function": "search",
                          "indexer": "all",
                          "indexerIds": os.environ.get("PROWLARR_INDEXER_IDS", ""),
                          "categories": "",
                          "timeoutSeconds": 30
                      }, separators=(",", ":"))
                  },
                  {
                      "name": "MangaDex (Native)",
                      "type": "MANGADEX",
                      "enabled": True,
                      "priority": 20,
                      "configJson": json.dumps({
                          "mangadex": {
                              "apiBaseUrl": "https://api.mangadex.org",
                              "siteBaseUrl": "https://mangadex.org",
