              existing_response = call("GET", "/downloads/sources", token=token)
              if isinstance(existing_response, list):
                  existing = existing_response
              else:
                  existing = existing_response.get("content") or existing_response.get("items") or existing_response.get("data") or []
              by_name = {item.get("name"): item for item in existing if isinstance(item, dict)}

              for source in sources:
                  current = by_name.get(source["name"])
                  if current and current.get("id") is not None:
                      print(f"updating source {source['name']}", flush=True)
                      call("PUT", f"/downloads/sources/{current['id']}", source, token=token)
                  else:
                      print(f"creating source {source['name']}", flush=True)
                      call("POST", "/downloads/sources", source, token=token)

              print("source bootstrap completed", flush=True)
