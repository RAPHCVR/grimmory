{{- $secretName := include "grimmory-stack.secretName" . -}}
{{- $singleReplicaStorageClass := lookup "storage.k8s.io/v1" "StorageClass" "" .Values.singleReplicaStorageClass.name -}}
{{- if and .Values.singleReplicaStorageClass.create (not $singleReplicaStorageClass) }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.singleReplicaStorageClass.name | quote }}
  labels:
    {{- include "grimmory-stack.labels" . | nindent 4 }}
provisioner: driver.longhorn.io
reclaimPolicy: {{ .Values.singleReplicaStorageClass.reclaimPolicy }}
allowVolumeExpansion: {{ .Values.singleReplicaStorageClass.allowVolumeExpansion }}
volumeBindingMode: Immediate
parameters:
  {{- toYaml .Values.singleReplicaStorageClass.parameters | nindent 2 }}
---
{{- end }}
{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "grimmory-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-username: {{ .Values.secrets.database.username | quote }}
  db-password: {{ .Values.secrets.database.password | quote }}
  db-root-password: {{ .Values.secrets.database.rootPassword | quote }}
  admin-username: {{ .Values.secrets.admin.username | quote }}
  admin-password: {{ .Values.secrets.admin.password | quote }}
  prowlarr-api-key: {{ .Values.secrets.prowlarr.apiKey | quote }}
  comicvine-api-key: {{ .Values.secrets.comicVine.apiKey | quote }}
  qbittorrent-username: {{ .Values.secrets.qbittorrent.username | quote }}
  qbittorrent-password: {{ .Values.secrets.qbittorrent.password | quote }}
  qbittorrent-password-pbkdf2: {{ .Values.secrets.qbittorrent.passwordPbkdf2 | quote }}
  stacks-username: {{ .Values.secrets.stacks.username | quote }}
  stacks-password-bcrypt: {{ .Values.secrets.stacks.passwordBcrypt | quote }}
  stacks-api-key: {{ .Values.secrets.stacks.apiKey | quote }}
  stacks-downloader-key: {{ .Values.secrets.stacks.downloaderKey | quote }}
  stacks-session-secret: {{ .Values.secrets.stacks.sessionSecret | quote }}
---
{{- end }}
{{- range $name, $claim := .Values.persistence.claims }}
{{- if $claim.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  {{- if $.Values.persistence.keepOnDelete }}
  annotations:
    "helm.sh/resource-policy": keep
  {{- end }}
  labels:
    {{- include "grimmory-stack.labels" $ | nindent 4 }}
spec:
  accessModes:
    - {{ $claim.accessMode | quote }}
  resources:
    requests:
      storage: {{ $claim.size | quote }}
  {{- $storageClass := default $.Values.global.storageClass $claim.storageClass }}
  {{- if $storageClass }}
  storageClassName: {{ $storageClass | quote }}
  {{- end }}
---
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: stacks-bootstrap
  labels:
    {{- include "grimmory-stack.labels" . | nindent 4 }}
data:
  entrypoint.sh: |
{{ .Files.Get "files/stacks-bootstrap-entrypoint.sh" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  labels:
    {{- include "grimmory-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
  selector:
    {{- include "grimmory-stack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  {{- if .Values.global.keel.enabled }}
  annotations:
    {{- include "grimmory-stack.keelAnnotations" . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "grimmory-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
spec:
  serviceName: mariadb
  replicas: 1
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      {{- include "grimmory-stack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mariadb
  template:
    metadata:
      labels:
        {{- include "grimmory-stack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mariadb
      annotations:
        {{- include "grimmory-stack.keelAnnotations" . | nindent 8 }}
    spec:
      {{- include "grimmory-stack.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: guard-existing-mariadb-datadir
          image: "{{ include "grimmory-stack.image" .Values.images.busybox }}"
          imagePullPolicy: {{ .Values.images.busybox.pullPolicy }}
          command:
            - sh
            - -ec
            - |
              if [ -d /var/lib/mysql/mysql ]; then
                echo "MariaDB datadir already initialized."
                exit 0
              fi

              meaningful_entry="$(find /var/lib/mysql -mindepth 1 -maxdepth 1 ! -name lost+found -print -quit 2>/dev/null || true)"
              if [ -z "$meaningful_entry" ]; then
                echo "MariaDB datadir is empty; fresh initialization is allowed."
                exit 0
              fi

              echo "FATAL: MariaDB datadir contains files but no /var/lib/mysql/mysql directory; refusing automatic fresh initialization on an existing PVC."
              ls -la /var/lib/mysql || true
              exit 42
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
      containers:
        - name: mariadb
          image: "{{ include "grimmory-stack.image" .Values.images.mariadb }}"
          imagePullPolicy: {{ .Values.images.mariadb.pullPolicy }}
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              value: {{ .Values.mariadb.database | quote }}
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: db-username
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: db-password
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: db-root-password
          readinessProbe:
            exec:
              command: ["sh", "-c", "mariadb-admin ping -h 127.0.0.1 -uroot -p$MARIADB_ROOT_PASSWORD"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "mariadb-admin ping -h 127.0.0.1 -uroot -p$MARIADB_ROOT_PASSWORD"]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.mariadb.resources | nindent 12 }}
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mariadb-data
          persistentVolumeClaim:
            claimName: mariadb-data
---
apiVersion: v1
kind: Service
metadata:
  name: grimmory
  labels:
    {{- include "grimmory-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: grimmory
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.grimmory.port }}
      targetPort: http
  selector:
    {{- include "grimmory-stack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: grimmory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grimmory
  {{- if .Values.global.keel.enabled }}
  annotations:
    {{- include "grimmory-stack.keelAnnotations" . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "grimmory-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: grimmory
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "grimmory-stack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grimmory
  template:
    metadata:
      labels:
        {{- include "grimmory-stack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: grimmory
      annotations:
        {{- include "grimmory-stack.keelAnnotations" . | nindent 8 }}
    spec:
      {{- include "grimmory-stack.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: {{ .Values.grimmory.groupId | int }}
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: "{{ include "grimmory-stack.image" .Values.images.busybox }}"
          imagePullPolicy: {{ .Values.images.busybox.pullPolicy }}
          command:
            - sh
            - -c
            - |
              until nc -z mariadb 3306; do echo waiting for mariadb; sleep 3; done
              mkdir -p /bookdrop/.downloads /bookdrop/.downloads/stacks-cache /books /app/data
              chown -R {{ .Values.grimmory.userId | int }}:{{ .Values.grimmory.groupId | int }} /bookdrop /books /app/data || true
              chmod 775 /bookdrop /books /app/data || true
              chmod 755 /bookdrop/lost+found /books/lost+found 2>/dev/null || true
          volumeMounts:
            - name: bookdrop
              mountPath: /bookdrop
            - name: grimmory-books
              mountPath: /books
            - name: grimmory-data
              mountPath: /app/data
      containers:
        - name: grimmory
          image: "{{ include "grimmory-stack.image" .Values.images.grimmory }}"
          imagePullPolicy: {{ .Values.images.grimmory.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: {{ .Values.grimmory.groupId | int }}
            runAsNonRoot: true
            runAsUser: {{ .Values.grimmory.userId | int }}
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: {{ .Values.grimmory.port }}
          env:
            - name: USER_ID
              value: {{ .Values.grimmory.userId | quote }}
            - name: GROUP_ID
              value: {{ .Values.grimmory.groupId | quote }}
            - name: TZ
              value: {{ .Values.global.timezone | quote }}
            - name: BOOKLORE_PORT
              value: {{ .Values.grimmory.port | quote }}
            - name: DATABASE_URL
              value: "jdbc:mariadb://mariadb:3306/{{ .Values.mariadb.database }}?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true"
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: db-username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: db-password
            - name: API_DOCS_ENABLED
              value: {{ .Values.grimmory.apiDocsEnabled | quote }}
            - name: DISK_TYPE
              value: {{ .Values.grimmory.diskType | quote }}
            - name: ALLOWED_ORIGINS
              value: "https://{{ .Values.ingress.hosts.grimmory }},http://localhost:6060,http://localhost:4200"
            - name: FORCE_DISABLE_OIDC
              value: {{ .Values.grimmory.forceDisableOidc | quote }}
            - name: UPLOADS_PER_USER
              value: {{ .Values.grimmory.uploadsPerUser | quote }}
            - name: BOOKLORE_DOWNLOADS_DEFAULT_LIBRARY_NAME
              value: {{ .Values.grimmory.downloads.defaultLibraryName | quote }}
            - name: BOOKLORE_DOWNLOADS_DEFAULT_LIBRARY_PATH
              value: {{ .Values.grimmory.downloads.defaultLibraryPath | quote }}
            - name: BOOKLORE_DOWNLOADS_DEFAULT_AUTO_FINALIZE
              value: {{ .Values.grimmory.downloads.defaultAutoFinalize | quote }}
            - name: BOOKLORE_DOWNLOADS_DEFAULT_CONFIDENCE_THRESHOLD
              value: {{ .Values.grimmory.downloads.defaultConfidenceThreshold | quote }}
            - name: GRIMMORY_DOWNLOADS_FLARESOLVERR_URL
              value: {{ .Values.grimmory.downloads.flaresolverr.url | quote }}
            - name: GRIMMORY_DOWNLOADS_FLARESOLVERR_TIMEOUT_MS
              value: {{ .Values.grimmory.downloads.flaresolverr.timeoutMs | quote }}
            - name: BOOKLORE_DOWNLOADS_RESOLVER_WEBTOONS_ASURA_ENABLED
              value: {{ .Values.grimmory.downloads.resolver.webtoons.asura.enabled | quote }}
            - name: BOOKLORE_DOWNLOADS_RESOLVER_WEBTOONS_ASURA_SEARCH_URL_TEMPLATES
              value: {{ .Values.grimmory.downloads.resolver.webtoons.asura.searchUrlTemplates | quote }}
            - name: BOOKLORE_DOWNLOADS_RESOLVER_COMICVINE_ENABLED
              value: {{ .Values.grimmory.downloads.resolver.comicVine.enabled | quote }}
            - name: BOOKLORE_DOWNLOADS_RESOLVER_COMICVINE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: comicvine-api-key
                  optional: true
          startupProbe:
            httpGet:
              path: /api/v1/healthcheck
              port: http
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/healthcheck
              port: http
            failureThreshold: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/healthcheck
              port: http
            failureThreshold: 5
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.grimmory.resources | nindent 12 }}
          volumeMounts:
            - name: grimmory-data
              mountPath: /app/data
            - name: grimmory-books
              mountPath: /books
            - name: bookdrop
              mountPath: /bookdrop
      volumes:
        - name: grimmory-data
          persistentVolumeClaim:
            claimName: grimmory-data
        - name: grimmory-books
          persistentVolumeClaim:
            claimName: grimmory-books
        - name: bookdrop
          persistentVolumeClaim:
            claimName: bookdrop
---
