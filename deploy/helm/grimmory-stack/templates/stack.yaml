apiVersion: v1
kind: Service
metadata:
  name: stacks
  labels:
    {{- include "grimmory-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: stacks
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.stacks.port }}
      targetPort: http
  selector:
    {{- include "grimmory-stack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: stacks
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stacks
  {{- if .Values.global.keel.enabled }}
  annotations:
    {{- include "grimmory-stack.keelAnnotations" . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "grimmory-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: stacks
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "grimmory-stack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: stacks
  template:
    metadata:
      labels:
        {{- include "grimmory-stack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: stacks
      annotations:
        {{- include "grimmory-stack.keelAnnotations" . | nindent 8 }}
    spec:
      {{- include "grimmory-stack.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: init-stacks-config
          image: "{{ include "grimmory-stack.image" .Values.images.busybox }}"
          imagePullPolicy: {{ .Values.images.busybox.pullPolicy }}
          env:
            - name: STACKS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: stacks-username
            - name: STACKS_PASSWORD_BCRYPT
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: stacks-password-bcrypt
            - name: STACKS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: stacks-api-key
            - name: STACKS_DOWNLOADER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: stacks-downloader-key
            - name: STACKS_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: stacks-session-secret
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /stacks-config /stacks-logs /bookdrop/.downloads/stacks-cache /bookdrop/.downloads/stacks-cache/incomplete
              chown -R 1000:1000 /bookdrop/.downloads /stacks-config /stacks-logs || true
              if [ ! -f /stacks-config/config.yaml ]; then
                printf '%s\n' \
                  'server:' \
                  '  host: 0.0.0.0' \
                  '  port: 7788' \
                  'login:' \
                  "  username: ${STACKS_USERNAME}" \
                  "  password: ${STACKS_PASSWORD_BCRYPT}" \
                  '  disable: false' \
                  'api:' \
                  "  key: ${STACKS_API_KEY}" \
                  "  downloader_key: ${STACKS_DOWNLOADER_KEY}" \
                  "  session_secret: ${STACKS_SESSION_SECRET}" \
                  'downloads:' \
                  '  delay: 2' \
                  '  retry_count: 3' \
                  '  resume_attempts: 3' \
                  '  prefer_title_naming: false' \
                  '  include_hash: none' \
                  '  incomplete_folder_path: /opt/stacks/download/incomplete' \
                  '  subdirectories: null' \
                  'fast_download:' \
                  '  enabled: false' \
                  '  key: null' \
                  'flaresolverr:' \
                  '  enabled: true' \
                  '  url: http://flaresolverr:8191' \
                  '  timeout: 60' \
                  'proxy:' \
                  '  enabled: false' \
                  '  url: null' \
                  '  username: null' \
                  '  password: null' \
                  'queue:' \
                  '  max_history: 100' \
                  'logging:' \
                  '  level: INFO' > /stacks-config/config.yaml
              fi
          volumeMounts:
            - name: stacks-config
              mountPath: /stacks-config
            - name: stacks-logs
              mountPath: /stacks-logs
            - name: bookdrop
              mountPath: /bookdrop
      containers:
        - name: stacks
          image: "{{ include "grimmory-stack.image" .Values.images.stacks }}"
          imagePullPolicy: {{ .Values.images.stacks.pullPolicy }}
          command: ["/bin/sh", "/opt/stacks/bootstrap/entrypoint.sh"]
          ports:
            - name: http
              containerPort: {{ .Values.stacks.port }}
          env:
            - name: SOLVERR_URL
              value: http://flaresolverr:8191
            - name: FLARESOLVERR_URL
              value: http://flaresolverr:8191
            - name: STACKS_CONFIG_FILE
              value: /opt/stacks/config/config.yaml
            - name: STACKS_FLARESOLVERR_URL
              value: http://flaresolverr:8191
            - name: STACKS_FLARESOLVERR_TIMEOUT
              value: "60"
            - name: STACKS_DOWNLOAD_INCOMPLETE_PATH
              value: /opt/stacks/download/incomplete
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.stacks.resources | nindent 12 }}
          volumeMounts:
            - name: stacks-config
              mountPath: /opt/stacks/config
            - name: stacks-logs
              mountPath: /opt/stacks/logs
            - name: bookdrop
              mountPath: /bookdrop
            - name: bookdrop
              mountPath: /opt/stacks/download
              subPath: .downloads/stacks-cache
            - name: bookdrop
              mountPath: /opt/stacks/download/incomplete
              subPath: .downloads/stacks-cache/incomplete
            - name: stacks-bootstrap
              mountPath: /opt/stacks/bootstrap
      volumes:
        - name: stacks-config
          emptyDir: {}
        - name: stacks-logs
          emptyDir: {}
        - name: stacks-bootstrap
          configMap:
            name: stacks-bootstrap
            defaultMode: 0755
        - name: bookdrop
          persistentVolumeClaim:
            claimName: bookdrop
---
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grimmory
  labels:
    {{- include "grimmory-stack.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- with .Values.ingress.tls }}
