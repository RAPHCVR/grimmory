                  number: {{ .Values.grimmory.port }}
    - host: {{ .Values.ingress.hosts.prowlarr | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prowlarr
                port:
                  number: {{ .Values.prowlarr.port }}
    - host: {{ .Values.ingress.hosts.qbittorrent | quote }}
      http:
        paths:
          - path: /
